<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Acceso de ventas</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Jefe de ventas</h1>

</header>

<main>

    <form id="login">

        <input
            type="text"
            id="usuario"
            placeholder="Usuario"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button>
            Ingresar
        </button>

    </form>

    <p id="mensaje"></p>

</main>

<script>

document.getElementById("login")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const respuesta = await fetch(
        "http://127.0.0.1:8000/admin/login",
        {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                usuario:
                    document.getElementById(
                        "usuario"
                    ).value,

                password:
                    document.getElementById(
                        "password"
                    ).value

            })

        }
    );

    const resultado =
        await respuesta.json();

    if (resultado.correcto) {

        window.location.href =
            "admin.html";

    } else {

        document.getElementById(
            "mensaje"
        ).textContent =
            resultado.mensaje;

    }

});

</script>

</body>

</html>
